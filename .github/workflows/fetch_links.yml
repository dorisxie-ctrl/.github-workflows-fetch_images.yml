name: Batch Shopee API Image Extractor

on:
  workflow_dispatch:
    inputs:
      api_urls:
        description: '请在下方批量粘贴 API 链接（多条请换行）:'
        required: true
        type: string

permissions:
  contents: write

jobs:
  extract-images:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install requests

    - name: Process API Links
      env:
        USER_INPUT: ${{ inputs.api_urls }}
      run: python parse_api.py

    - name: Save results to repo
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add image_links.txt
        git commit -m "Auto: Update batch extracted image links" || exit 0
        git push
